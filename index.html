<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OP WATCHES - Official Store</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #e0e0e0; }
        header { background: #000; padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        .logo { font-size: 24px; font-weight: bold; color: #f39c12; letter-spacing: 2px; }
        .hero { text-align: center; padding: 60px 20px; background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=1920&q=80') no-repeat center center/cover; }
        .hero h1 { font-size: 40px; color: #fff; margin-bottom: 10px; }
        .hero p { font-size: 18px; color: #f39c12; }
        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .section-title { font-size: 28px; margin-bottom: 20px; border-bottom: 2px solid #f39c12; display: inline-block; padding-bottom: 5px; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .product-card { background: #1e1e1e; border: 1px solid #333; border-radius: 8px; overflow: hidden; text-align: center; padding-bottom: 20px; }
        .product-card img { width: 100%; height: 250px; object-fit: cover; }
        .product-card h3 { font-size: 20px; margin: 15px 0 10px; color: #fff; }
        .price { font-size: 18px; color: #f39c12; margin-bottom: 15px; }
        .buy-btn { background: #f39c12; color: #000; border: none; padding: 10px 20px; font-weight: bold; border-radius: 4px; cursor: pointer; transition: 0.3s; }
        .buy-btn:hover { background: #d35400; color: #fff; }
        
        /* Checkout Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; }
        .modal-content { background: #1e1e1e; padding: 30px; border-radius: 8px; width: 90%; max-width: 400px; border: 1px solid #444; }
        .modal-content h3 { margin-bottom: 20px; color: #f39c12; text-align: center; }
        .modal-content label { display: block; margin-bottom: 5px; font-size: 14px; }
        .modal-content input, .modal-content select { width: 100%; padding: 10px; margin-bottom: 15px; background: #2c2c2c; border: 1px solid #444; color: #fff; border-radius: 4px; }
        .close-modal { background: #e74c3c; width: 100%; margin-top: 10px; }
        footer { text-align: center; padding: 40px; background: #000; margin-top: 60px; color: #777; border-top: 1px solid #333; }
    </style>
</head>
<body>

    <header>
        <div class="logo">OP WATCHES</div>
        <div class="nav-links">
            <span style="color: #f39c12; cursor: pointer;">Home</span>
        </div>
    </header>

    <div class="hero">
        <h1>NEW PREMIUM ARRIVALS</h1>
        <p>Luxury Masterpieces | Free Delivery Nationwide</p>
    </div>

    <div class="container">
        <h2 class="section-title">Featured Watches</h2>
        <div class="products-grid">
            <!-- Product 1 -->
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?auto=format&fit=crop&w=600&q=80" alt="Watch">
                <h3>OP Royal Master</h3>
                <div class="price">Rs. 2,999 <span style="text-decoration: line-through; color: #777; font-size: 14px;">Rs. 4,999</span></div>
                <button class="buy-btn" onclick="openCheckout('OP Royal Master', 2999)">Buy Now</button>
            </div>
            <!-- Product 2 -->
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1524805444758-089113d48a6d?auto=format&fit=crop&w=600&q=80" alt="Watch">
                <h3>OP Classic Chrono</h3>
                <div class="price">Rs. 3,499 <span style="text-decoration: line-through; color: #777; font-size: 14px;">Rs. 5,999</span></div>
                <button class="buy-btn" onclick="openCheckout('OP Classic Chrono', 3499)">Buy Now</button>
            </div>
        </div>
    </div>

    <!-- Checkout Popup Modal -->
    <div class="modal" id="checkoutModal">
        <div class="modal-content">
            <h3 id="modalProductName">Complete Order</h3>
            <form id="orderForm" onsubmit="submitOrder(event)">
                <label>Full Name</label>
                <input type="text" id="custName" required placeholder="Enter your name">

                <label>Phone Number</label>
                <input type="tel" id="custPhone" required placeholder="10-digit mobile number">

                <label>Delivery Address</label>
                <input type="text" id="custAddress" required placeholder="Full address with Pincode">

                <label>Payment Option</label>
                <select id="paymentType" onchange="updateTotal()">
                    <option value="cod_advance">30% Advance (Rest 70% COD)</option>
                    <option value="full_online">Full Prepaid (Get 10% Instant Discount!)</option>
                    <option value="full_cod">Full Cash on Delivery (No Discount)</option>
                </select>

                <p id="payableAmount" style="margin-bottom: 15px; font-weight: bold; color: #f39c12;"></p>

                <button type="submit" class="buy-btn" style="width: 100%;">Place Order</button>
                <button type="button" class="buy-btn close-modal" onclick="closeCheckout()">Cancel</button>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 OP WATCHES. All Rights Reserved.</p>
    </footer>

    <script>
        let selectedProduct = "";
        let productPrice = 0;

        function openCheckout(name, price) {
            selectedProduct = name;
            productPrice = price;
            document.getElementById('modalProductName').innerText = "Checkout: " + name;
            updateTotal();
            document.getElementById('checkoutModal').style.display = 'flex';
        }

        function closeCheckout() {
            document.getElementById('checkoutModal').style.display = 'none';
        }

        function updateTotal() {
            let type = document.getElementById('paymentType').value;
            let display = document.getElementById('payableAmount');
            
            if(type === 'cod_advance') {
                let adv = Math.round(productPrice * 0.30);
                display.innerText = "Pay Now (30% Advance): Rs. " + adv + " | Balance on Delivery: Rs. " + (productPrice - adv);
            } else if(type === 'full_online') {
                let discounted = Math.round(productPrice * 0.90);
                display.innerText = "Total Payable (10% OFF Applied): Rs. " + discounted;
            } else {
                display.innerText = "Total Payable (Full COD): Rs. " + productPrice;
            }
        }

        function submitOrder(e) {
            e.preventDefault();
            let name = document.getElementById('custName').value;
            let phone = document.getElementById('custPhone').value;
            let address = document.getElementById('custAddress').value;
            let type = document.getElementById('paymentType').value;

            alert("Thank you " + name + "! Order placed successfully for " + selectedProduct + ". We will contact you on " + phone + " to confirm shipment.");
            closeCheckout();
        }
    </script>

</body>
</html>
